<!doctype html>
<!--
  RepoReady self-check report template (format repoready-self-check/1).
  scripts/render_report.py fills it from findings.json. To fill it by hand
  (no Python): replace every {{name}} with plain text (write &amp; &lt; &gt;
  for & < >), and replace every "slot" comment with markup shaped like the
  examples in the comment at the end of this file. Keep the header (logo
  and link) and the colours exactly as they are. A self-check gives no level:
  each to-do has a severity (Critical, Important, Recommended).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Self-check · {{project_name}} · {{date}}</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f4f6fa;
    --line: #dce1eb;
    --text: #151b2b;
    --body: #3a4358;
    --muted: #5b6478;
    --brand: #0a6fe6;
    --brand-text: #0759b4;
    --brand-soft: #f3f9ff;
    --brand-line: #b9ddff;
    --good: #047857; --good-bg: #ecfdf5; --good-line: #a7f3d0;
    --warn: #92400e; --warn-bg: #fffbeb; --warn-line: #fde68a; --warn-mark: #d97706;
    --crit: #be123c; --crit-bg: #fff1f2; --crit-line: #fecdd3; --crit-mark: #e11d48;
    --none: #5b6478; --none-bg: #f4f6fa; --none-line: #dce1eb;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111624;
      --surface: #1b2234;
      --line: #2e3850;
      --text: #f4f6fa;
      --body: #d6dbe6;
      --muted: #a3acbf;
      --brand: #4aa6ff;
      --brand-text: #84c4ff;
      --brand-soft: #102545;
      --brand-line: #1d4b80;
      --good: #6ee7b7; --good-bg: #0d2a22; --good-line: #14532d;
      --warn: #fcd34d; --warn-bg: #2b2210; --warn-line: #713f12; --warn-mark: #f59e0b;
      --crit: #fda4af; --crit-bg: #2e1219; --crit-line: #7f1d1d; --crit-mark: #fb7185;
      --none: #a3acbf; --none-bg: #1b2234; --none-line: #2e3850;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--body);
    font: 15px/1.55 var(--sans);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 28px; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 12px; color: var(--text); }
  h2 { font-size: 19px; margin: 40px 0 10px; padding-bottom: 4px; border-bottom: 2px solid var(--brand-line); color: var(--text); }
  h3 { font-size: 16px; margin: 22px 0 8px; color: var(--brand-text); }
  p { margin: 0 0 10px; }
  a { color: var(--brand-text); }
  code { font-family: var(--mono); font-size: 0.88em; overflow-wrap: anywhere; }
  main, td, th, li, p { overflow-wrap: anywhere; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .result .summary { max-width: 68ch; font-size: 16.5px; line-height: 1.6; margin: 0 0 8px; color: var(--text); }
  .result .since { font-size: 14px; margin: 0; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin: 0 0 12px; font-size: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  thead th { background: var(--surface); }
  table.facts th { width: 11em; }
  table.results td:first-child { width: 34%; }
  table.results td:last-child { width: 34%; }
  .state { display: inline-block; padding: 0 7px; border: 1px solid var(--none-line); border-radius: 999px; background: var(--none-bg); color: var(--none); white-space: nowrap; font-size: 13px; font-weight: 600; }
  .state.met { color: var(--good); background: var(--good-bg); border-color: var(--good-line); }
  .state.not_met { color: var(--crit); background: var(--crit-bg); border-color: var(--crit-line); }
  .state.not_settled { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
  .tag { display: inline-block; font-family: var(--mono); font-size: 12.5px; padding: 0 6px; border: 1px solid var(--brand-line); border-radius: 4px; background: var(--brand-soft); color: var(--brand-text); margin-right: 6px; }
  .sev { display: inline-block; flex: none; padding: 1px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em; border: 1px solid; }
  .sev-critical { color: var(--crit); background: var(--crit-bg); border-color: var(--crit-line); }
  .sev-important { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
  .sev-recommended { color: var(--brand-text); background: var(--brand-soft); border-color: var(--brand-line); }
  .todo-card { border: 1px solid var(--line); border-left: 4px solid var(--none-line); border-radius: 10px; padding: 14px 16px 12px; margin: 0 0 12px; background: var(--bg); break-inside: avoid; }
  .todo-card.sev-edge-critical { border-left-color: var(--crit-mark); }
  .todo-card.sev-edge-important { border-left-color: var(--warn-mark); }
  .todo-card.sev-edge-recommended { border-left-color: var(--brand); }
  .later > p.muted { margin: 0 0 12px; }
  .todo-card.later-card { border-left-color: var(--muted); }
  .sev-later { color: var(--body); background: var(--surface); border-color: var(--line); }
  .todo-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 6px; }
  .todo-head h4 { font-size: 16.5px; line-height: 1.35; margin: 0; color: var(--text); }
  .why { margin: 0 0 8px; }
  .meta { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .who { display: inline-block; padding: 0 8px; border-radius: 4px; font-size: 12.5px; font-weight: 600; background: var(--surface); color: var(--body); }
  .who-agent_can_fix { background: var(--good-bg); color: var(--good); }
  .who-agent_needs_answer { background: var(--brand-soft); color: var(--brand-text); }
  .who-authors_only { background: var(--surface); color: var(--body); }
  details.evidence { border-top: 1px dashed var(--line); padding-top: 8px; }
  details.evidence > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--brand-text); font-weight: 600; user-select: none; }
  details.evidence > summary::-webkit-details-marker { display: none; }
  details.evidence > summary::before { content: ""; width: 6px; height: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform 0.15s; margin-right: 2px; }
  details.evidence[open] > summary::before { transform: rotate(45deg); }
  details.evidence > summary .count { color: var(--muted); font-weight: 400; font-family: var(--mono); font-size: 12px; }
  details.evidence > summary .opened, details.evidence[open] > summary .closed { display: none; }
  details.evidence[open] > summary .opened { display: inline; }
  .evidence-body { margin: 10px 0 2px; background: var(--surface); border-radius: 8px; padding: 4px 12px; font-size: 13.5px; }
  .finding { padding: 8px 0; }
  .finding + .finding { border-top: 1px solid var(--line); }
  .f-title { font-weight: 600; color: var(--text); margin: 0 0 4px; }
  .f-title .tag { font-weight: 400; }
  .f-detail { margin: 0 0 4px; }
  .finding ul.ev { margin: 0 0 4px; padding-left: 18px; }
  .finding li { margin: 0 0 2px; }
  .finding .quote { display: block; color: var(--muted); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .f-fix { margin: 0; color: var(--body); }
  .f-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-right: 4px; }
  details.panel { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 0 0 10px; }
  details.panel > summary { cursor: pointer; font-weight: 600; color: var(--text); }
  details.panel[open] > summary { margin-bottom: 8px; }
  .muted { color: var(--muted); }
  .ref { display: inline-block; font-family: var(--mono); font-size: 12.5px; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  table.facts a { text-decoration: none; }
  table.facts a:hover { text-decoration: underline; }
  .scroll { overflow-x: auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; padding: 0 0 14px; margin: 0 0 28px; border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; line-height: 0; }
  .logo { height: 28px; width: auto; color: var(--text); }
  .howto { font-size: 14px; font-weight: 600; text-decoration: none; color: var(--brand-text); white-space: nowrap; }
  .howto::after { content: " →"; }
  .howto:hover { text-decoration: underline; }
  @media (max-width: 600px) {
    main { padding-top: 16px; }
    .top { margin-bottom: 20px; }
    h1 { font-size: 24px; }
    h2 { margin-top: 32px; }
    table.facts th { width: auto; }
    th, td { padding: 5px 4px; }
  }
  @media print {
    :root {
      --bg: #ffffff; --surface: #f4f6fa; --line: #c2c9d7; --text: #000000; --body: #151b2b; --muted: #3a4358;
      --brand: #0a6fe6; --brand-text: #0759b4; --brand-soft: #f3f9ff; --brand-line: #b9ddff;
      --good: #047857; --good-bg: #ecfdf5; --good-line: #a7f3d0;
      --warn: #92400e; --warn-bg: #fffbeb; --warn-line: #fde68a; --warn-mark: #d97706;
      --crit: #be123c; --crit-bg: #fff1f2; --crit-line: #fecdd3; --crit-mark: #e11d48;
      --none: #3a4358; --none-bg: #f4f6fa; --none-line: #c2c9d7;
    }
    @page {
      size: A4; margin: 16mm 14mm 20mm;
      @top-center { content: "Self-check · user generated · not a RepoReady certification"; font: 8pt system-ui, sans-serif; color: #000; }
      @bottom-center { content: "Self-check · page " counter(page) " of " counter(pages); font: 8pt system-ui, sans-serif; color: #000; }
    }
    body { font-size: 11pt; }
    main { max-width: none; padding: 0; }
    a { text-decoration: none; }
    h2, h3, h4, h5 { break-after: avoid; }
    .todo-card, .finding, tr { break-inside: avoid; }
    details.evidence > summary { display: none; }
    /* Printed reports show the technical details unfolded. */
    details::details-content { content-visibility: visible; display: block; }
    details summary { list-style: none; }
    .scroll { overflow: visible; }
  }
</style>
</head>
